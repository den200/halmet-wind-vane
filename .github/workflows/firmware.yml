# Build on every push; publish a GitHub release with the OTA .bin on a v* tag.
#
# Release flow: bump FW_VERSION in src/version.h, commit, tag "v<version>",
# push the tag. The job refuses to publish if the tag and FW_VERSION disagree,
# so the /update page on the board always reports what the release says.
name: firmware

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --quiet platformio

      - name: Host tests (angle transform)
        run: tools/run_host_tests.sh

      - name: Read firmware version
        id: ver
        run: |
          ver=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' src/version.h)
          test -n "$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$ver" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match FW_VERSION $ver in src/version.h"
            exit 1
          fi

      - name: Build
        run: pio run -e halmet

      - name: Package
        run: |
          name=halmet-wind-v${{ steps.ver.outputs.version }}.bin
          cp .pio/build/halmet/firmware.bin "$name"
          sha256sum "$name" > "$name.sha256"
          cat "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: halmet-wind-v${{ steps.ver.outputs.version }}
          path: |
            halmet-wind-v*.bin
            halmet-wind-v*.bin.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            halmet-wind-v*.bin
            halmet-wind-v*.bin.sha256
          generate_release_notes: true
